name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash -n build.sh
  build:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch build and push, no emulation
        id: img
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          push: "true"
          tags: |
            ghcr.io/azrtydxb/image-build-action-test:run-${{ github.run_id }}
            ghcr.io/azrtydxb/image-build-action-test:latest
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
          sbom: "true"
          provenance: mode=max
      - name: Outputs and the pushed manifest list
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
          IMAGEID: ${{ steps.img.outputs.imageid }}
          META: ${{ steps.img.outputs.metadata }}
        run: |
          set -eu
          echo "digest=$DIGEST imageid=$IMAGEID"
          echo "$META"
          case "$DIGEST" in sha256:*) ;; *) echo "no digest"; exit 1 ;; esac
          [ -n "$IMAGEID" ]
          ref=ghcr.io/azrtydxb/image-build-action-test@$DIGEST
          raw=$(docker buildx imagetools inspect --raw "$ref")
          echo "$raw"
          echo "$raw" | grep -q '"architecture": *"amd64"'
          echo "$raw" | grep -q '"architecture": *"arm64"'
      - name: Attestations are in the registry
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          set -eu
          cosign="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ibb-attest/cosign-3.1.4-amd64"
          ref=ghcr.io/azrtydxb/image-build-action-test
          id='https://github.com/azrtydxb/image-build-action/.*'
          iss=https://token.actions.githubusercontent.com
          "$cosign" verify-attestation --type slsaprovenance1 --certificate-identity-regexp "$id" --certificate-oidc-issuer "$iss" "$ref@$DIGEST" >/dev/null
          crane="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ibb-attest/crane-0.22.1-amd64"
          "$crane" manifest "$ref@$DIGEST" | python3 -c 'import json,sys; print("\n".join(m["platform"]["os"]+"/"+m["platform"]["architecture"]+" "+m["digest"] for m in json.load(sys.stdin)["manifests"] if m["platform"]["os"]!="unknown"))' >"$RUNNER_TEMP/plats"
          [ "$(wc -l <"$RUNNER_TEMP/plats")" = 2 ]
          while read -r plat d; do
            "$cosign" verify-attestation --type spdxjson --certificate-identity-regexp "$id" --certificate-oidc-issuer "$iss" "$ref@$d" >/dev/null
            echo "sbom ok for $plat"
          done <"$RUNNER_TEMP/plats"
      - name: Second run reads the layer cache
        id: again
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
  attest-only:
    needs: build
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Index created without the action, then attested
        id: idx
        run: |
          set -eu
          ref=ghcr.io/azrtydxb/image-build-action-test
          docker buildx imagetools create -t "$ref:attest-only-${{ github.run_id }}" "$ref:latest"
          echo "digest=$(docker buildx imagetools inspect "$ref:attest-only-${{ github.run_id }}" --format '{{json .Manifest.Digest}}' | tr -d '"')" >> "$GITHUB_OUTPUT"
      - uses: ./
        with:
          attest-only: "true"
          tags: ghcr.io/azrtydxb/image-build-action-test:attest-only-${{ github.run_id }}
          digest: ${{ steps.idx.outputs.digest }}
          provenance: "true"
      - run: |
          cosign=$(ls "${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}"/ibb-attest/cosign-3.1.4-amd64)
          "$cosign" verify-attestation --type slsaprovenance1 --certificate-identity-regexp 'https://github.com/azrtydxb/image-build-action/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "ghcr.io/azrtydxb/image-build-action-test@${{ steps.idx.outputs.digest }}" >/dev/null
  insecure:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: A plain-HTTP registry in the job's dind, reached from the Podman sidecar
        run: docker run -d --restart=always -p 127.0.0.1:5001:5000 --name reg docker.io/library/registry:2.8.3
      - id: img
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          push: "true"
          tags: localhost:5001/ibb-test:ci
          insecure-registries: localhost:5001
          secrets: |
            tok=s3cr3t
          sbom: "true"
          provenance: "true"
      - name: Pushed and attested
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          set -eu
          cosign="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ibb-attest/cosign-3.1.4-amd64"
          curl -fsS -H 'Accept: application/vnd.oci.image.index.v1+json' "http://localhost:5001/v2/ibb-test/manifests/$DIGEST" | grep -q '"arm64"'
          "$cosign" verify-attestation --allow-insecure-registry --type slsaprovenance1 --certificate-identity-regexp 'https://github.com/azrtydxb/image-build-action/.*' --certificate-oidc-issuer https://token.actions.githubusercontent.com "localhost:5001/ibb-test@$DIGEST" >/dev/null
  single:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: printf s3cr3t > "$RUNNER_TEMP/tok.txt"
      - name: Single platform, push and load into dind
        id: img
        uses: ./
        with:
          context: test/ctx
          push: "true"
          load: "true"
          tags: ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
          sbom: "true"
          provenance: "true"
          secret-files: |
            tok=${{ runner.temp }}/tok.txt
      - run: |
          set -eu
          [ -n "${{ steps.img.outputs.digest }}" ]
          docker run --rm ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
