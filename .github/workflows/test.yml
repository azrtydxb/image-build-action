name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
  id-token: write
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash -n build.sh
  build:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch build and push, no emulation
        id: img
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          push: "true"
          tags: |
            ghcr.io/azrtydxb/image-build-action-test:run-${{ github.run_id }}
            ghcr.io/azrtydxb/image-build-action-test:latest
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
          sbom: "true"
          provenance: mode=max
      - name: Outputs and the pushed manifest list
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
          IMAGEID: ${{ steps.img.outputs.imageid }}
          META: ${{ steps.img.outputs.metadata }}
        run: |
          set -eu
          echo "digest=$DIGEST imageid=$IMAGEID"
          echo "$META"
          case "$DIGEST" in sha256:*) ;; *) echo "no digest"; exit 1 ;; esac
          [ -n "$IMAGEID" ]
          ref=ghcr.io/azrtydxb/image-build-action-test@$DIGEST
          raw=$(docker buildx imagetools inspect --raw "$ref")
          echo "$raw"
          echo "$raw" | grep -q '"architecture": *"amd64"'
          echo "$raw" | grep -q '"architecture": *"arm64"'
      - name: Attestations are in the registry
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
        run: |
          set -eu
          cosign="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ibb-attest/cosign-3.1.4-amd64"
          ref=ghcr.io/azrtydxb/image-build-action-test
          id='https://github.com/azrtydxb/image-build-action/.*'
          iss=https://token.actions.githubusercontent.com
          "$cosign" verify-attestation --type slsaprovenance1 --certificate-identity-regexp "$id" --certificate-oidc-issuer "$iss" "$ref@$DIGEST" >/dev/null
          crane="${RUNNER_TOOL_CACHE:-$RUNNER_TEMP}/ibb-attest/crane-0.22.1-amd64"
          "$crane" manifest "$ref@$DIGEST" | python3 -c 'import json,sys
for m in json.load(sys.stdin)["manifests"]:
    p = m["platform"]
    if p["os"] != "unknown": print(p["os"] + "/" + p["architecture"], m["digest"])' >"$RUNNER_TEMP/plats"
          [ "$(wc -l <"$RUNNER_TEMP/plats")" = 2 ]
          while read -r plat d; do
            "$cosign" verify-attestation --type spdxjson --certificate-identity-regexp "$id" --certificate-oidc-issuer "$iss" "$ref@$d" >/dev/null
            echo "sbom ok for $plat"
          done <"$RUNNER_TEMP/plats"
      - name: Second run reads the layer cache
        id: again
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
  single:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: printf s3cr3t > "$RUNNER_TEMP/tok.txt"
      - name: Single platform, push and load into dind
        id: img
        uses: ./
        with:
          context: test/ctx
          push: "true"
          load: "true"
          tags: ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
          sbom: "true"
          provenance: "true"
          secret-files: |
            tok=${{ runner.temp }}/tok.txt
      - run: |
          set -eu
          [ -n "${{ steps.img.outputs.digest }}" ]
          docker run --rm ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
