name: test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true
jobs:
  syntax:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - run: bash -n build.sh
  build:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Multi-arch build and push, no emulation
        id: img
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          push: "true"
          tags: |
            ghcr.io/azrtydxb/image-build-action-test:run-${{ github.run_id }}
            ghcr.io/azrtydxb/image-build-action-test:latest
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
      - name: Outputs and the pushed manifest list
        env:
          DIGEST: ${{ steps.img.outputs.digest }}
          IMAGEID: ${{ steps.img.outputs.imageid }}
          META: ${{ steps.img.outputs.metadata }}
        run: |
          set -eu
          echo "digest=$DIGEST imageid=$IMAGEID"
          echo "$META"
          case "$DIGEST" in sha256:*) ;; *) echo "no digest"; exit 1 ;; esac
          [ -n "$IMAGEID" ]
          ref=ghcr.io/azrtydxb/image-build-action-test@$DIGEST
          raw=$(docker buildx imagetools inspect --raw "$ref")
          echo "$raw"
          echo "$raw" | grep -q '"architecture": *"amd64"'
          echo "$raw" | grep -q '"architecture": *"arm64"'
      - name: Second run reads the layer cache
        id: again
        uses: ./
        with:
          context: test/ctx
          platforms: linux/amd64,linux/arm64
          build-args: |
            MSG=a=b
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          secrets: |
            tok=s3cr3t
  single:
    runs-on: arc-azrtydxb-amd64
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - run: printf s3cr3t > "$RUNNER_TEMP/tok.txt"
      - name: Single platform, push and load into dind
        id: img
        uses: ./
        with:
          context: test/ctx
          push: "true"
          load: "true"
          tags: ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
          secret-files: |
            tok=${{ runner.temp }}/tok.txt
      - run: |
          set -eu
          [ -n "${{ steps.img.outputs.digest }}" ]
          docker run --rm ghcr.io/azrtydxb/image-build-action-test:single-${{ github.run_id }}
