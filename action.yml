name: Image build (Buildah)
description: >
  Build and push a container image (multi-arch without emulation) through the rootless Podman
  service sidecar of the quadronix ARC runners (arc-azrtydxb-amd64), as a drop-in for
  docker/setup-buildx-action + docker/build-push-action. Uses the registry credentials the job
  already has (docker/login-action, azrtydxb/ant-setup-action). Only for jobs that run in the
  runner container, without `container:`.
inputs:
  context:
    description: Build context directory.
    default: "."
  file:
    description: Path of the Dockerfile (default is <context>/Dockerfile).
    default: ""
  platforms:
    description: >
      Comma-separated platforms, for example linux/amd64,linux/arm64. More than one builds a
      manifest list. Other platforms than the runner's are cross-compiled without emulation: the
      Dockerfile must run every RUN on $BUILDPLATFORM and not in the target stage (see README).
    default: linux/amd64
  tags:
    description: Image tags, one per line or comma-separated. Required with push.
    default: ""
  push:
    description: Push every tag to its registry (using the job's docker credentials).
    default: "false"
  load:
    description: >
      Single platform only: also load the image into the runner's Docker daemon (dind) with
      docker load, so docker run and docker compose can use it.
    default: "false"
  build-args:
    description: Build arguments, one KEY=VALUE per line.
    default: ""
  labels:
    description: Image labels, one KEY=VALUE per line.
    default: ""
  target:
    description: Target stage of a multi-stage Dockerfile.
    default: ""
  secrets:
    description: >
      Build secrets, one id=VALUE per line (exposed as RUN --mount=type=secret,id=<id>). Written
      to temporary files that are removed after the build.
    default: ""
  secret-files:
    description: Build secrets from files, one id=PATH per line.
    default: ""
  no-cache:
    description: Do not use the layer cache.
    default: "false"
  pull:
    description: Always pull newer base images (--pull=always) instead of using the local copy.
    default: "false"
  auth-file:
    description: >
      Docker config.json with the registry credentials. Default is $DOCKER_CONFIG/config.json or
      ~/.docker/config.json, where docker/login-action and ant-setup-action write theirs.
    default: ""
  sbom:
    description: >
      With push: attach an SPDX SBOM (syft) as a keyless cosign attestation to the pushed image, or to
      each platform manifest of a manifest list. Any value but false/empty turns it on. Needs
      `permissions: id-token: write`.
    default: "false"
  provenance:
    description: >
      With push: attach a SLSA v1 build provenance as a keyless cosign attestation to the pushed digest
      (the index for several platforms). Any value but false/empty (for example mode=max) turns it on.
      Needs `permissions: id-token: write`.
    default: "false"
  podman-version:
    description: podman-remote release to use. Only the version in the action's checksum table is accepted.
    default: "6.1.3"
outputs:
  digest:
    description: Digest of the pushed image or manifest list (empty without push).
    value: ${{ steps.build.outputs.digest }}
  imageid:
    description: ID of the built image or manifest list in the Podman store.
    value: ${{ steps.build.outputs.imageid }}
  platform-digests:
    description: One "os/arch digest" line per platform manifest of the pushed list (empty for one platform).
    value: ${{ steps.build.outputs.platform-digests }}
  metadata:
    description: Build result as JSON (containerimage.digest, image.name, containerimage.config.digest).
    value: ${{ steps.build.outputs.metadata }}
runs:
  using: composite
  steps:
    - id: build
      shell: bash
      env:
        IBB_CONTEXT: ${{ inputs.context }}
        IBB_FILE: ${{ inputs.file }}
        IBB_PLATFORMS: ${{ inputs.platforms }}
        IBB_TAGS: ${{ inputs.tags }}
        IBB_PUSH: ${{ inputs.push }}
        IBB_LOAD: ${{ inputs.load }}
        IBB_BUILD_ARGS: ${{ inputs.build-args }}
        IBB_LABELS: ${{ inputs.labels }}
        IBB_TARGET: ${{ inputs.target }}
        IBB_SECRETS: ${{ inputs.secrets }}
        IBB_SECRET_FILES: ${{ inputs.secret-files }}
        IBB_NO_CACHE: ${{ inputs.no-cache }}
        IBB_PULL: ${{ inputs.pull }}
        IBB_AUTH_FILE: ${{ inputs.auth-file }}
        IBB_PODMAN_VERSION: ${{ inputs.podman-version }}
      run: bash "$GITHUB_ACTION_PATH/build.sh"
    - id: attest
      if: ${{ steps.build.outputs.digest != '' && (inputs.sbom != 'false' && inputs.sbom != '' || inputs.provenance != 'false' && inputs.provenance != '') }}
      shell: bash
      env:
        IBB_TAGS: ${{ inputs.tags }}
        IBB_DIGEST: ${{ steps.build.outputs.digest }}
        IBB_PLATFORM_DIGESTS: ${{ steps.build.outputs.platform-digests }}
        IBB_PLATFORMS: ${{ inputs.platforms }}
        IBB_SBOM: ${{ inputs.sbom }}
        IBB_PROVENANCE: ${{ inputs.provenance }}
        IBB_AUTH_FILE: ${{ inputs.auth-file }}
        IBB_PODMAN_VERSION: ${{ inputs.podman-version }}
      run: bash "$GITHUB_ACTION_PATH/attest.sh"
